<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLLEN DRIFT</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #10141c;
    /* System fonts only: the page fetches nothing at all. */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 960 / 540));
    height: auto;
    aspect-ratio: 960 / 540;
    touch-action: none;
    box-shadow: 0 0 0 1px rgba(255, 243, 224, 0.12);
  }
  /* Read aloud, never shown: what a screen reader announces about the meadow. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"
  aria-label="POLLEN DRIFT: fly the bee with WASD or the arrow keys, collect nectar from flowers, fill the hive before dusk, and sting the wasps that hunt you"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="src/main.js"></script>
</body>
</html>
